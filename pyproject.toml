[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.7.1",
    "feature-engine==1.8.2",
    "lightgbm==4.6.0",
    "xgboost==3.0.0",
    "optuna==4.3.0",
    "evidently==0.7.17",
    "pingouin==0.5.5",
    "statsmodels==0.14.4",
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
    "joblib==1.4.2",
    "shap==0.47.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]